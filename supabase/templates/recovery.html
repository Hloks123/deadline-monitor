<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f8fafc;color:#0f172a;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px">
            <tr>
              <td style="padding:36px">
                <p style="margin:0;color:#0d9488;font-size:13px;font-weight:bold;letter-spacing:2px;text-transform:uppercase">Deadline Monitor</p>
                <h1 style="margin:20px 0 12px;font-size:28px;line-height:1.25">Reset your Deadline Monitor password</h1>
                <p style="margin:0;color:#475569;font-size:16px;line-height:1.6">Use the button below to choose a new password for your account.</p>
                <p style="margin:28px 0">
                  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;border-radius:10px;background:#0d9488;padding:14px 22px;color:#ffffff;font-weight:bold;text-decoration:none">Reset password</a>
                </p>
                <p style="margin:0;color:#64748b;font-size:13px;line-height:1.6">If you did not request a password reset, you can ignore this email.</p>
                <p style="margin:28px 0 0;color:#64748b;font-size:12px">Deadline Monitor</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
